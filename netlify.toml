[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/sms/dispatch"
  to = "/.netlify/functions/sms-dispatch"
  status = 200

[[redirects]]
  from = "/api/sms/balance"
  to = "/.netlify/functions/sms-balance"
  status = 200

[[redirects]]
  from = "/api/sms/status"
  to = "/.netlify/functions/sms-status"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
